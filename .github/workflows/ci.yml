name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task fmt:check
      - run: deno task lint
      - run: deno task check
      # The resolver, the downloadable validator and the published JSON Schema must agree.
      - run: deno task audit:contract:local
