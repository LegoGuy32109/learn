name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The same checks the pre-push hook runs: fmt, lint, check, and the contract audit, which
      # proves the resolver, the downloadable validator and the published JSON Schema agree.
      - run: deno task verify
